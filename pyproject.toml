[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deepseek-whalechan-robot"
version = "0.2.4"
description = "Expressive DeepSeek Whale-chan embodied character simulation in MuJoCo"
requires-python = ">=3.13"
license = "MIT"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements-character.txt"]}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
