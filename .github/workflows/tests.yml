name: Asset installer and task tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  screen-game:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node docs/play/build.cjs --check
      - run: node --test docs/play/game.test.cjs
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q tests/test_character_asset_install.py tests/test_tasks.py tests/test_footsteps.py tests/test_policy_bundle.py
      # Transport/history checks need no provider key or character assets.
      # The cancelled-response physics scenario also runs locally with the assets installed.
      - run: python -m pytest -q tests/test_persona.py -k "not cancelled_response"
      - run: python -m pytest -q tests/test_behavior_interruptions.py
  cpu-policy-tools:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: training/pyproject.toml
      - run: python -m pip install ./training
      - run: python -m pip check
      - run: python -c "import importlib.util; assert all(importlib.util.find_spec(m) is None for m in ('torch', 'mjlab', 'warp', 'rsl_rl'))"
      - run: whalechan-evaluate --help
      - run: whalechan-evaluate-suite --help
      - run: whalechan-inspect-policy --help
      - run: whalechan-audit-data --help
      - run: python -m pip install './training[test]'
      - run: python -m pytest -q training/tests --ignore=training/tests/test_data.py --ignore=training/tests/test_training_contract.py
  training-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: training/pyproject.toml
      - run: python -m pip install torch==2.8.0 torchvision==0.23.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install './training[train,test]'
      - run: python -m pytest -q training/tests
