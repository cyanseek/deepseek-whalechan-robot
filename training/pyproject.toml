[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "whalechan-training"
version = "0.39.0"
description = "Experimental own-body mjlab training and independent native policy evaluation"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "mjlab==1.3.0", "rsl-rl-lib==5.0.1", "mujoco==3.10.0",
  "mujoco-warp==3.8.1", "warp-lang==1.12.0", "numpy==2.3.5",
  "torch==2.8.0", "torchvision==0.23.0", "tensordict==0.10.0",
  "onnx==1.22.0", "onnxruntime==1.24.4",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.entry-points."mjlab.tasks"]
whalechan_training_vd39 = "whalechan_training.registration"

[project.scripts]
whalechan-train = "whalechan_training.run:main"
whalechan-export = "whalechan_training.export:main"
whalechan-evaluate = "whalechan_training.evaluate:main"
whalechan-audit-data = "whalechan_training.audit_data:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["whalechan_training*"]

[tool.setuptools.package-data]
whalechan_training = ["body/*.xml", "body/*.json", "body/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
